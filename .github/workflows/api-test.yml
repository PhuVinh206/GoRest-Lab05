name: GoRest API Testing

on:
  push:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run \
            2474802010441_PhamPhuVinh_GoRest.postman_collection.json \
            -e 2474802010441_PhamPhuVinh_GoRest_Env.postman_environment.json \
            --env-var "token=$GOREST_TOKEN" \
            -d users.csv
